[package]
name = "v2engine"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Lightweight native Linux proxy client"

[[bin]]
name = "v2engine"
path = "src/main.rs"

[[bin]]
name = "v2engine-helper"
path = "src/bin/helper.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
dirs = "6"
gtk = { package = "gtk4", version = "0.10", features = ["v4_6"] }
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
libc = "0.2"
nix = { version = "0.30", features = ["signal", "process", "user"] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
