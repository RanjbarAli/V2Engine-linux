name: Build Debian package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev pkg-config lintian
      - name: Download verified sing-box core
        run: ./packaging/fetch-sing-box.sh
      - name: Check formatting and lint
        run: cargo fmt --all --check && cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets --locked
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)" = "$VERSION"
          cargo build --release --locked
          ./packaging/build-deb.sh "$VERSION"
          (
            cd dist
            sha256sum "V2Engine_${VERSION}_amd64.deb" > "V2Engine_${VERSION}_amd64.deb.sha256"
          )
        if: startsWith(github.ref, 'refs/tags/v')
      - name: Upload release package
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/V2Engine_*_amd64.deb
            dist/V2Engine_*_amd64.deb.sha256
          generate_release_notes: true

  apt-repository:
    name: Publish signed APT repository
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install -y reprepro gnupg
      - name: Download and verify release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p packages
          gh release download "$GITHUB_REF_NAME" --pattern '*.deb' --pattern '*.deb.sha256' --dir packages
          cd packages
          sha256sum --check *.deb.sha256
      - name: Import APT signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          test -n "$APT_GPG_PRIVATE_KEY"
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          FINGERPRINT="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          test -n "$FINGERPRINT"
          echo "APT_SIGNING_FINGERPRINT=$FINGERPRINT" >> "$GITHUB_ENV"
      - name: Build signed repository
        run: |
          mkdir -p apt-site/apt/conf
          sed "s/@SIGNING_KEY@/$APT_SIGNING_FINGERPRINT/" packaging/apt/distributions.in > apt-site/apt/conf/distributions
          reprepro --basedir apt-site/apt includedeb stable packages/*.deb
          gpg --batch --armor --export "$APT_SIGNING_FINGERPRINT" > apt-site/apt/v2engine.asc
          rm -rf apt-site/apt/conf apt-site/apt/db
          cp packaging/apt/index.html apt-site/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apt-site
      - name: Deploy APT repository to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
